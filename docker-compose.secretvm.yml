services:
  block-capitol:
    image: popeblack/the-block-capitol:build-series-20261027
    container_name: block-capitol
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.block-capitol.rule=Host(`theblockcapitol.com`) || Host(`www.theblockcapitol.com`) || Host(`sapphire-tarsier.vm.scrtlabs.com`)
      - traefik.http.routers.block-capitol.entrypoints=websecure
      - traefik.http.routers.block-capitol.tls=true
      - traefik.http.routers.block-capitol.tls.certresolver=letsencrypt
      - traefik.http.services.block-capitol.loadbalancer.server.port=80

  traefik:
    image: traefik:v2.10
    container_name: traefik
    restart: unless-stopped
    command:
      - --api.insecure=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=thepopeblack@gmail.com
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - traefik

networks:
  traefik:
    driver: bridge

volumes:
  letsencrypt: